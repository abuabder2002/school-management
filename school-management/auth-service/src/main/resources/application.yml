server:
  port: 8081

spring:
  application:
    name: AUTH-SERVICE
  datasource:
    url: ${AUTH_DB_URL:jdbc:postgresql://localhost:5432/sms_auth_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      keepalive-time: 30000
      minimum-idle: 2
      maximum-pool-size: 10
      connection-test-query: SELECT 1
      validation-timeout: 5000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: ${EUREKA_PREFER_IP:true}
    ip-address: 127.0.0.1
    hostname: ${EUREKA_HOSTNAME:localhost}
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 10

app:
  bootstrap-admin:
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
    name: ${BOOTSTRAP_ADMIN_NAME:School Admin}
  bootstrap-superadmin:
    email: ${BOOTSTRAP_SUPERADMIN_EMAIL:}
    password: ${BOOTSTRAP_SUPERADMIN_PASSWORD:}
    name: ${BOOTSTRAP_SUPERADMIN_NAME:Super Admin}
  default-school:
    name: ${DEFAULT_SCHOOL_NAME:Default School}

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000  # 24 hours in ms

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.school.auth: INFO
